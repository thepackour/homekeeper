# 홈키퍼 실제 브로커 설정 (hub, door Pi). 규약: docs/mqtt.md
listener 1883
allow_anonymous false
password_file /etc/mosquitto/homekeeper.passwd
acl_file /etc/mosquitto/homekeeper.acl
persistence true
persistence_location /var/lib/mosquitto/

# 월패드·폰 웹 화면용 (mqtt.js가 WebSocket으로 접속). 계정, 권한(ACL)은 1883과 똑같이 적용된다
listener 9001
protocol websockets
