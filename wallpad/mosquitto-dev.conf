# 노트북 개발용 브로커 설정 (홈키파 월패드·폰 화면)
# 실행: 이 폴더에서 mosquitto -c mosquitto-dev.conf -v
# 노트북 안에서만 열리고 로그인 없이 접속된다. 실제 브로커 설정은 저장소 broker/mosquitto.conf.

# Pi 코드, mosquitto_pub/sub, tools/fake.mjs용 (MQTT)
listener 1883 localhost

# 화면용 (mqtt.js가 WebSocket으로 접속)
listener 9001 localhost
protocol websockets

# 개발 중에는 로그인 없이 접속 허용
allow_anonymous true
